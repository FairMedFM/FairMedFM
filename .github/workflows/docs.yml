name: Documentation
# Checks that the documentation builds. The site is published from
# https://github.com/Nanboy-Ronan/FairMedFM-page, which builds these docs from main at /docs/.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # The API reference reads docstrings from the package source; no package install is needed.
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict
