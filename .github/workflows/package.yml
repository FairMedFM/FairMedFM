name: Pip package
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.10'
            minimum: true
          - python-version: '3.11'
          - python-version: '3.12'
          - python-version: '3.13'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the lowest supported dependency versions
        if: matrix.minimum
        run: python -m pip install numpy==1.23.5 pandas==1.5.3 scikit-learn==1.1.3
      - name: Install (optional file readers except with the lowest dependency versions)
        run: |
          if [ "${{ matrix.minimum }}" = "true" ]; then extras=test; else extras=io,test; fi
          python -m pip install -e ".[$extras]" ruff
      - run: ruff check .
      - run: python -m pytest -q tests/test_metrics.py tests/test_cli.py tests/test_evaluate.py tests/test_cli_inputs.py tests/test_group_metrics.py
      - name: Build the distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
      - name: Run from the installed wheel outside the checkout
        run: |
          python -m pip uninstall -y fairmedfm
          python -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          python -c "import fairmedfm; assert 'site-packages' in fairmedfm.__file__, fairmedfm.__file__"
          python -c "import sys; assert 'torch' not in sys.modules; import fairmedfm.metrics; assert 'torch' not in sys.modules"
          python - <<'PY'
          import numpy as np, pandas as pd
          rng = np.random.default_rng(0)
          label = rng.integers(0, 2, 200)
          pd.DataFrame({"prob": np.clip(0.3 + 0.4 * label + rng.normal(0, 0.2, 200), 0, 1), "label": label,
                        "sex": rng.choice(["F", "M"], 200)}).to_csv("pred.csv", index=False)
          pd.DataFrame({"dice": rng.uniform(0.5, 0.95, 50), "sex": rng.choice(["F", "M"], 50)}).to_csv("dice.csv", index=False)
          PY
          fairmedfm --version
          fairmedfm score pred.csv --output cls.json
          fairmedfm score dice.csv --format table
  benchmark:
    # Benchmark runner (benchmark/) with segmentation on CPU: imports, configs, CLI and checkpoint-free SAM3 checks.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      # The metrics package from this checkout first, so the runner's fairmedfm>=0.4.1 requirement is met locally.
      - run: python -m pip install -e '.[test]' -e './benchmark[seg,test]'
      - run: python -m pytest -q
      - run: fairmedfm run --help
      - name: Build the runner distributions
        run: |
          python -m pip install build twine
          python -m build benchmark
          python -m twine check --strict benchmark/dist/*
