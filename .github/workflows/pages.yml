name: Pages
# Builds the project page (homepage/) and the documentation (docs/) and publishes them at
# https://fairmedfm.github.io/FairMedFM/ (documentation at /docs/). Pull requests only check that the site builds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.assemble.outputs.changed }}
      indexnow_key: ${{ steps.assemble.outputs.indexnow_key }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the sitemap dates each page by its last commit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: docs/requirements.txt
      # The API reference reads docstrings from the package source; no package install is needed.
      - run: python -m pip install -r docs/requirements.txt
      - run: mkdocs build --strict --site-dir _site/docs
      - name: Add the project page, sitemaps, robots.txt, llms.txt and verification files
        id: assemble
        run: |
          python homepage/assemble_site.py _site > changed-urls.txt
          cat changed-urls.txt
          echo "changed=$(python -c 'import json,sys; print(json.dumps(sys.stdin.read().split()))' < changed-urls.txt)" >> "$GITHUB_OUTPUT"
          echo "indexnow_key=$(ls homepage/verification | sed -n 's/^\([0-9a-f]\{32\}\)\.txt$/\1/p' | head -1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      # IndexNow tells Bing (which also serves Copilot and ChatGPT search), Yandex, Seznam and Naver about pages
      # changed since yesterday. The key file is published from homepage/verification/.
      - name: Submit changed pages to IndexNow
        if: needs.build.outputs.changed != '[]' && needs.build.outputs.changed != '' && needs.build.outputs.indexnow_key != ''
        continue-on-error: true
        env:
          URLS: ${{ needs.build.outputs.changed }}
          KEY: ${{ needs.build.outputs.indexnow_key }}
        run: |
          payload=$(python3 -c 'import json,os; k=os.environ["KEY"]; print(json.dumps({"host": "fairmedfm.github.io", "key": k, "keyLocation": f"https://fairmedfm.github.io/FairMedFM/{k}.txt", "urlList": json.loads(os.environ["URLS"])}))')
          curl -sS -o /dev/null -w "IndexNow: HTTP %{http_code}\n" -X POST https://api.indexnow.org/indexnow \
            -H "Content-Type: application/json; charset=utf-8" -d "$payload"
