[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fairmedfm"
version = "0.1.0"
description = "Fairness metrics for any binary classification or segmentation model: subgroup AUC, accuracy, calibration and Dice gaps, equalized odds and equity-scaled Dice"
readme = "README.md"
requires-python = ">=3.10"
license = "CC-BY-4.0"
license-files = ["LICENSE"]
authors = [
  { name = "Ruinan Jin", email = "ruinanjin@alumni.ubc.ca" },
  { name = "Zikang Xu" },
  { name = "Yuan Zhong" },
  { name = "Qiongsong Yao" },
  { name = "Qi Dou" },
  { name = "S. Kevin Zhou" },
  { name = "Xiaoxiao Li" },
]
keywords = [
  "fairness", "fairness metrics", "algorithmic fairness", "bias evaluation", "subgroup analysis",
  "equalized odds", "AUC gap", "calibration", "expected calibration error", "segmentation fairness",
  "Dice", "medical imaging", "foundation models", "responsible AI", "benchmark",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Image Recognition",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
  "Typing :: Typed",
]
dependencies = ["numpy>=1.23", "pandas>=1.5", "scikit-learn>=1.1"]

[project.optional-dependencies]
# Benchmark runner (fairmedfm run) with the built-in foundation models. Models whose packages are not on PyPI
# (BLIP/BLIP2 via LAVIS, CONCH, Merlin, SAM2, SAM3) need a separate install; see the documentation.
# Upper bounds: the code uses transformers 4.x APIs, albumentations 1.x transforms and torchmetrics' dice.
cls = [
  "torch>=2.3", "torchvision>=0.18", "timm>=1.0", "transformers>=4.40,<5", "open_clip_torch>=2.24",
  "openai-clip>=1.0.1", "ftfy", "regex", "medclip>=0.0.3", "peft>=0.11", "einops>=0.6", "albumentations>=1.3,<2",
  "opencv-python-headless>=4.8", "pillow", "SimpleITK>=2.2", "matplotlib", "torchmetrics>=1.4,<1.7", "tqdm",
  # openai-clip imports pkg_resources, which setuptools 81 removed.
  "setuptools<81",
]
seg = ["fairmedfm[cls]", "segment-anything>=1.0", "trans-utils>=0.2.1,<0.3"]
test = ["pytest>=8"]
dev = ["fairmedfm[test]", "build>=1.2", "twine>=5"]

[project.urls]
Homepage = "https://github.com/FairMedFM/FairMedFM"
Documentation = "https://github.com/FairMedFM/FairMedFM#pip-package-fairness-metrics-for-any-model"
Repository = "https://github.com/FairMedFM/FairMedFM"
Issues = "https://github.com/FairMedFM/FairMedFM/issues"
Paper = "https://arxiv.org/abs/2407.00983"
Changelog = "https://github.com/FairMedFM/FairMedFM/blob/main/CHANGELOG.md"

[project.scripts]
fairmedfm = "fairmedfm.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fairmedfm = ["py.typed", "configs/**/*.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = ["notebooks", "pre-processing", "build"]

[tool.ruff.lint]
# Baseline: syntax errors, undefined names and other definite mistakes.
select = ["E9", "F63", "F7", "F82"]

[tool.ruff.lint.per-file-ignores]
# Known defect: the ResNet constructors reference torchvision's removed model_urls when pretrained=True.
"src/fairmedfm/models/c2l.py" = ["F821"]
