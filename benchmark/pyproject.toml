[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The FairMedFM benchmark runner (fairmedfm run). It is installed from GitHub, not PyPI:
#   pip install "fairmedfm-bench @ git+https://github.com/FairMedFM/FairMedFM#subdirectory=benchmark"
[project]
name = "fairmedfm-bench"
version = "0.4.1"
description = "FairMedFM benchmark runner: fairness of medical imaging foundation models on classification and segmentation"
readme = "README.md"
requires-python = ">=3.10"
# moco_cxr.py keeps the CC BY-NC 4.0 license of MoCo; see THIRD_PARTY_NOTICES.md.
license = "Apache-2.0 AND CC-BY-NC-4.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "Ruinan Jin", email = "ruinanjin@alumni.ubc.ca" },
  { name = "Zikang Xu" },
  { name = "Yuan Zhong" },
  { name = "Qingsong Yao" },
  { name = "Qi Dou" },
  { name = "S. Kevin Zhou" },
  { name = "Xiaoxiao Li" },
]
# Models whose packages are not on PyPI (BLIP/BLIP2 via LAVIS, CONCH, Merlin, SAM2, SAM3) need a separate
# install; see the documentation. Upper bounds: the code uses transformers 4.x APIs, albumentations 1.x transforms
# and torchmetrics' dice.
dependencies = [
  "fairmedfm>=0.4.1",
  "torch>=2.3", "torchvision>=0.18", "timm>=1.0", "transformers>=4.40,<5", "open_clip_torch>=2.24",
  "openai-clip>=1.0.1", "ftfy", "regex", "medclip>=0.0.3", "peft>=0.11", "einops>=0.6", "albumentations>=1.3,<2",
  "opencv-python-headless>=4.8", "pillow", "SimpleITK>=2.2", "matplotlib", "torchmetrics>=1.4,<1.7", "tqdm",
  # openai-clip imports pkg_resources, which setuptools 81 removed.
  "setuptools<81",
]

[project.optional-dependencies]
seg = ["segment-anything>=1.0"]
test = ["pytest>=8"]

[project.urls]
Documentation = "https://nanboy-ronan.github.io/FairMedFM-page/docs/benchmark/"
Repository = "https://github.com/FairMedFM/FairMedFM"
Paper = "https://arxiv.org/abs/2407.00983"

[tool.setuptools.packages.find]
include = ["fairmedfm_bench", "fairmedfm_bench.*"]

[tool.setuptools.package-data]
fairmedfm_bench = ["configs/**/*.json"]
